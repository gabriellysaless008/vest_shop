<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | Vest Shop</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>
    
<main class="container">
    <aside class="register-image" aria-label="Editorial de moda Vest Shop">
        <div class="image-caption">
            <span>VEST SHOP</span>
            <p>ESTILO. ESSÊNCIA. VOCÊ.</p>
        </div>
    </aside>

    <section class="register-card">
        <!-- Mantenha aqui o conteúdo atual do seu cadastro -->
            

            <!-- LOGO -->
            <div class="brand">
                <span>VEST SHOP</span>
            </div>

            <!-- CABEÇALHO -->
            <header class="header">
                <h1>Crie sua conta</h1>
                <p>Cadastre-se para começar a utilizar nossa plataforma.</p>
            </header>

            <!-- FORMULÁRIO -->
            <form id="registerForm">

                <!-- NOME -->
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" autocomplete="name" required>
                </div>

                <!-- EMAIL -->
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@email.com" autocomplete="email" required>
                </div>

                <!-- DATA DE NASCIMENTO -->
                <div class="form-group">
                    <label for="data_nascimento">Data de nascimento</label>
                    <input type="text" id="data_nascimento" name="data_nascimento" placeholder="DD/MM/AAAA" maxlength="10" inputmode="numeric" autocomplete="bday" required>
                </div>

                <!-- SENHA -->
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" autocomplete="new-password" minlength="6" required>
                    <small>A senha deve ter pelo menos 6 caracteres.</small>
                </div>

                <!-- CONFIRMAR SENHA -->
                <div class="form-group">
                    <label for="confirmaSenha">Confirmar senha</label>
                    <input type="password" id="confirmaSenha" name="confirmPassword" placeholder="Digite a senha novamente" autocomplete="new-password" required>
                </div>

                <!-- PROGRAMA DE FIDELIDADE -->
                <div class="remember">
                    <input type="checkbox" id="participa_programa_fidelidade" name="participa_programa_fidelidade">
                    <label for="participa_programa_fidelidade">Quero participar do programa de fidelidade</label>
                </div>

                <!-- MENSAGEM -->
                <div id="mensagem" class="message"></div>
                <p id="message" role="status" aria-live="polite"></p>

                <!-- BOTÃO -->
                <button type="submit" id="botao_cadastro" class="primary-button" onclick="cadastrar(event)">
                    Criar minha conta
                </button>

            </form>

            <!-- LOGIN -->
            <div class="login-link">
                <span>Já possui uma conta?</span>
                <a href="login.html">Entrar</a>
            </div>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/cadastro.js"></script>
</body>

</html>
