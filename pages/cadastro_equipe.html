<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Equipe | Vest Shop</title>
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/cadastrar_equipe.css">
</head>
<body>
    <main class="pagina-equipe">
        <header class="cabecalho-equipe">
            <span>VEST SHOP / ADMINISTRAÇÃO</span>
            <h1>Gerenciar equipe.</h1>
            <p>Cadastre novos integrantes e defina suas permissões dentro da plataforma Vest Shop.</p>
        </header>

        <section class="formulario-equipe">
            <form id="form-cadastro-equipe">
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="funcionario@vestshop.com" required>
                </div>

                <div class="campo">
                    <label for="data_nascimento">Data de nascimento</label>
                    <input type="text" id="data_nascimento" name="data_nascimento" placeholder="DD/MM/AAAA" maxlength="10" inputmode="numeric" required>
                </div>

                <div class="campo">
                    <label for="tipo_perfil">Perfil do funcionário</label>
                    <select id="tipo_perfil" name="tipo_perfil" required>
                        <option value="">Selecione um perfil</option>
                        <option value="atendente">Atendente</option>
                        <option value="gerente">Gerente</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite uma senha" required>
                </div>

                <div class="campo">
                    <label for="confirmaSenha">Confirmar senha</label>
                    <input type="password" id="confirmaSenha" name="confirmaSenha" placeholder="Confirme a senha" required>
                </div>

                <button type="submit" class="botao-cadastrar">Cadastrar funcionário</button>
                <div id="mensagem" class="mensagem"></div>
            </form>
        </section>

        <a href="home.html" class="voltar">← Voltar para a página inicial</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../pages/js/cadastro_equipe.js" defer></script>
</body>
</html>
