
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolher acesso | Vest Shop</title>
    <link rel="stylesheet" href="../css/escolha_acesso.css">
</head>
<body>

    <main class="container">

        <aside class="login-image">
            <div class="image-caption">
                <span>VEST SHOP</span>
                <p>MODA QUE EXPRESSA VOCÊ.</p>
            </div>
        </aside>

        <section class="access-card">

            <div class="brand">
                <span>VEST SHOP</span>
            </div>

            <header class="header">
                <h1>Bem-vindo!</h1>
                <p>Selecione o tipo de acesso para continuar.</p>
            </header>

            <nav class="access-options" aria-label="Tipos de acesso">

                <a href="login.html?perfil=cliente" class="access-button">
                    <span>Cliente</span>
                    <span class="arrow" aria-hidden="true">→</span>
                </a>

                <a href="login.html?perfil=atendente" class="access-button">
                    <span>Atendente</span>
                    <span class="arrow" aria-hidden="true">→</span>
                </a>

                <a href="login.html?perfil=gerente" class="access-button">
                    <span>Gerente</span>
                    <span class="arrow" aria-hidden="true">→</span>
                </a>

                <a href="login.html?perfil=administrador" class="access-button">
                    <span>Administrador</span>
                    <span class="arrow" aria-hidden="true">→</span>
                </a>

            </nav>

            <div class="register-link">
                <span>Ainda não possui uma conta?</span>
                <a href="cadastro.html">Criar conta</a>
            </div>

        </section>
    </main>

</body>
</html>
